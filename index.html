<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Overlay Livechat</title>
    <style>
        /* NOUVEAU : On crée une variable CSS pour le niveau de zoom */
        :root {
            --widget-scale: 0.7; /* 70% par défaut : Idéal pour 1080p */
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: transparent;
        }

        #widget-container {
            position: absolute;
            top: 10px;     
            right: 10px;   
            max-width: 800px; 
            display: none; 
            flex-direction: column;
            align-items: flex-end; 
            gap: 15px; 
            /* NOUVEAU : Application du zoom dynamique */
            transform: scale(var(--widget-scale));
            transform-origin: top right; 
        }

        #author-container {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: rgba(0, 0, 0, 0.85);
            padding: 10px 25px 10px 10px; 
            border-radius: 50px; 
            color: white;
            font-family: 'Arial', sans-serif;
            font-size: 24px; 
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
        }

        #author-avatar {
            width: 50px; 
            height: 50px;
            border-radius: 50%; 
            border: 2px solid #ffcc00;
            display: block;
        }

        #media-container img, #media-container video, #media-container iframe {
            max-width: 800px; 
            max-height: 600px; 
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7); 
            object-fit: contain;
        }

        #text-container {
            text-align: right;
            color: white;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 45px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            max-width: 800px;
            word-wrap: break-word;
        }

        #media-container iframe {
            border: 0;
            min-height: calc(200px / var(--widget-scale));
            max-height: none;
        }

        /* NOUVEAU : indicateur de volume (façon OSD Windows), indépendant du
           widget média/texte pour ne jamais couper une vidéo en cours de lecture. */
        #volume-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            align-items: center;
            gap: 15px;
            background-color: rgba(0, 0, 0, 0.85);
            padding: 12px 25px;
            border-radius: 50px;
            color: white;
            font-family: 'Arial', sans-serif;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
        }

        #volume-bar {
            display: flex;
            gap: 4px;
        }

        /* NOUVEAU : composant de barre à segments réutilisable (volume, zoom...) */
        .bar-segment {
            width: 18px;
            height: 22px;
            border-radius: 3px;
            background-color: rgba(255, 255, 255, 0.25);
        }

        .bar-segment.filled {
            background-color: #ffcc00;
        }

        /* Barre de zoom : affichée dans #text-container, qui a par défaut une
           police "Impact" toute en majuscules pour le texte de chat — on
           réinitialise ces styles pour ce cas précis. */
        .osd-bar-wrapper {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-end; /* mis à jour dynamiquement selon la position (cf. applyPosition) */
            gap: 8px;
        }

        .osd-bar-wrapper .osd-percent {
            font-family: 'Arial', sans-serif;
            font-size: 28px;
            font-weight: bold;
            text-transform: none;
            letter-spacing: normal;
            text-shadow: none;
        }

        .osd-bar-wrapper .bar-row {
            display: flex;
            gap: 4px;
        }
    </style>
</head>
<body>

    <div id="widget-container">
        <div id="author-container">
            <img id="author-avatar" alt="" />
            <span id="author-name"></span>
        </div>
        <div id="media-container"></div>
        <div id="text-container"></div>
    </div>

    <div id="volume-indicator">
        <span id="osd-label">🔊 VOLUME</span>
        <div id="volume-bar"></div>
    </div>

    <script src="media-utils.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
